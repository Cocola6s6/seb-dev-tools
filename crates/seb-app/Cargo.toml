[package]
name = "seb-app"
version = "0.2.3"
edition = "2021"
description = "共享电单车中控调试与 ECU 配置发包工具（Tauri + Sycamore）"
license = "MIT"

[lib]
name = "seb_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "seb-app"
path = "src/main.rs"

[dependencies]
seb-core   = { path = "../seb-core" }
tauri      = { version = "2", features = ["rustls-tls"] }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
strip = true
opt-level = "s"
