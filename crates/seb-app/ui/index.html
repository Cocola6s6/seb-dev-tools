<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>共享单车调试工具</title>
  <style>
    :root {
      color-scheme: light;
      --text:      #16181d;
      --text-2:    #4b5563;
      --muted:     #8b93a1;
      --surface:   #ffffff;
      --line:      #e4e9f0;
      --line-soft: #eef1f6;
      --accent:    #2f6bff;
      --accent-2:  #5b8cff;
      --glow:      rgba(47, 107, 255, .14);
      --ok:        #16a34a;
      --warn:      #b45309;
      --error:     #dc2626;
      --radius:    14px;
      --radius-sm: 9px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      color: var(--text);
      background: #f7f9fd;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      scrollbar-width: thin;
      scrollbar-color: #dbe1ea transparent;
    }

    .header, .header *,
    .nav, .nav *,
    button, button *,
    .tab, .tab *,
    .pill, .dot,
    .device-item, .device-item *,
    .client-qr-card, .client-qr-card * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    .nav, .nav *,
    button, button *,
    input, textarea, select,
    .device-item, .client-qr-card,
    .modal-dialog, .modal-dialog * {
      -webkit-app-region: no-drag;
    }

    .header::selection, .header *::selection,
    .nav::selection, .nav *::selection,
    button::selection, button *::selection {
      background: transparent !important;
      color: inherit !important;
    }

    input, textarea, .log-line, .log-line *, pre, code {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    .mono, textarea, .log-body, .log-line {
      font-family: Menlo, "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    }

    .app  { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
    .main { min-height: 0; overflow: hidden; }

    /* 每个页面只换色相，明度与结构不变，切换时整窗有一点点颜色变化 */
    .tint-deploy  { --accent: #2f6bff; --accent-2: #5b8cff; --glow: rgba(47, 107, 255, .16); --bg-top: #e7eeff; }
    .tint-control { --accent: #0d8ad8; --accent-2: #38b6ef; --glow: rgba(13, 138, 216, .16); --bg-top: #e2f2fb; }
    .tint-ecu     { --accent: #5c5ce0; --accent-2: #8285f0; --glow: rgba(92, 92, 224, .15); --bg-top: #eaeafc; }
    .tint-client  { --accent: #0f9d76; --accent-2: #3fc39b; --glow: rgba(15, 157, 118, .15); --bg-top: #e3f7f0; }
    .tint-battery { --accent: #0d9488; --accent-2: #14b8a6; --glow: rgba(13, 148, 136, .15); --bg-top: #e8f7f5; }
    .tint-settings{ --accent: #475569; --accent-2: #64748b; --glow: rgba(71, 85, 105, .16); --bg-top: #f1f5f9; }

    .app::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(90% 55% at 50% -8%, var(--glow), transparent 70%),
        linear-gradient(180deg, var(--bg-top) 0%, #f6f9fd 48%, #ffffff 100%);
      transition: background .45s ease;
      z-index: -1;
    }

    .header {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 88px;
      padding: 0 20px 12px;
      /* 拖窗口靠 header 上的 data-tauri-drag-region；标题栏隐藏后这里就是唯一的拖拽区 */
      cursor: default;
      z-index: 1000;
    }

    .spacer { flex: 1; }

    .nav {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px;
      background: rgba(255, 255, 255, .88);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 2px 10px rgba(16, 24, 40, .07);
      backdrop-filter: blur(20px);
    }
    .nav-track {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 106px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 2px 12px var(--glow);
      transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.2, 1.05), background 0.35s ease, box-shadow 0.35s ease;
      z-index: 1;
      pointer-events: none;
    }
    .nav-track.active-0 .nav-indicator { transform: translateX(0px); }
    .nav-track.active-1 .nav-indicator { transform: translateX(110px); }
    .nav-track.active-2 .nav-indicator { transform: translateX(220px); }
    .nav-track.active-3 .nav-indicator { transform: translateX(330px); }
    .nav-track.active-4 .nav-indicator { transform: translateX(440px); }

    button.nav-item,
    button.nav-item:hover,
    button.nav-item:active,
    button.nav-item:focus,
    button.nav-item:focus-visible {
      position: relative;
      z-index: 2;
      width: 106px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13.8px;
      font-weight: 500;
      font-family: inherit;
      color: var(--text-2);
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.25s ease, transform 0.12s ease;
      user-select: none;
    }
    button.nav-item:hover {
      color: var(--text);
    }
    button.nav-item.active {
      color: #ffffff !important;
      font-weight: 600;
    }
    button.nav-item:active {
      transform: scale(0.96);
    }

    .nav-qr-container {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    button.nav-qr-icon-btn,
    .nav-qr-icon-btn {
      position: relative;
      z-index: 9992;
      width: 36px !important;
      height: 36px !important;
      min-width: 36px !important;
      min-height: 36px !important;
      border-radius: 50% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      color: var(--text-2) !important;
      cursor: pointer;
      margin-left: 2px;
      margin-right: 4px;
      padding: 0 !important;
      transition: all 0.15s ease;
      flex: none;
    }
    button.nav-qr-icon-btn:hover,
    button.nav-qr-icon-btn:hover:not(:disabled),
    .nav-qr-icon-btn:hover {
      background: rgba(0, 0, 0, 0.06) !important;
      color: var(--text) !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      transform: scale(1.08);
    }
    button.nav-qr-icon-btn.active,
    button.nav-qr-icon-btn.active:hover,
    button.nav-qr-icon-btn.active:not(:disabled),
    .nav-qr-icon-btn.active {
      background: var(--accent) !important;
      color: #ffffff !important;
      border: none !important;
      outline: none !important;
      box-shadow: 0 2px 10px var(--glow) !important;
    }
    button.nav-qr-icon-btn:active,
    .nav-qr-icon-btn:active {
      transform: scale(0.95);
    }
    /* 顶栏按钮的说明比较长，原生 title 要等一秒才出来，这里自己画一个 */
    .nav-qr-tip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      top: calc(100% + 8px);
      right: -4px;
      white-space: nowrap;
      background: #1e293b;
      color: #f8fafc;
      font-size: 11px;
      font-weight: 400;
      padding: 5px 10px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.28);
      pointer-events: none;
      z-index: 9993;
      transition: opacity .15s ease, visibility .15s ease;
    }
    .nav-qr-tip::after {
      content: "";
      position: absolute;
      bottom: 100%;
      right: 18px;
      border-width: 4px;
      border-style: solid;
      border-color: transparent transparent #1e293b transparent;
    }
    .nav-qr-container:hover .nav-qr-tip {
      visibility: visible;
      opacity: 1;
      transition-delay: .5s;
    }
    .popover-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9990;
      background: transparent;
    }
    .nav-qr-popover {
      position: absolute;
      top: calc(100% + 12px);
      left: -8px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(16, 24, 40, 0.22);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      animation: fadeIn .12s ease-out;
      user-select: none;
    }
    .nav-qr-popover::before {
      content: "";
      position: absolute;
      bottom: 100%;
      left: 22px;
      border-width: 6px;
      border-style: solid;
      border-color: transparent transparent #ffffff transparent;
    }
    .nav-qr-head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .qr-svg-container {
      width: 176px;
      height: 176px;
      background: #ffffff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .qr-svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .nav-qr-foot {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 20px;
    }
    .qr-bike-no {
      font-family: Menlo, "SF Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      min-width: 0;
      max-width: calc(100% - 22px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .qr-copy-btn {
      position: absolute;
      right: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      opacity: 0.7;
      transition: all .15s ease;
    }
    .qr-copy-btn:hover {
      color: var(--accent);
      background: transparent;
      opacity: 1;
    }
    .qr-copy-btn:active {
      transform: scale(0.85);
    }
    .qr-copy-btn.copied {
      color: var(--ok);
      background: transparent;
      opacity: 1;
    }

    .pills {
      position: absolute;
      right: 20px;
      top: 42px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      z-index: 10;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px;
      height: 22px;
      box-sizing: border-box;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      color: var(--text-2);
      background: rgba(255, 255, 255, .82);
      border: 1px solid var(--line);
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .03);
    }
    .pill .btn-with-tip + .btn-with-tip { margin-left: 2px; }
    .conn-icon { display: inline-flex; color: var(--muted); opacity: .45; }
    .conn-icon.on { color: var(--ok); opacity: 1; }
    .pill span { font-size: 11px; line-height: 1; }
    .pill .mono { font-size: 11px; line-height: 1; }

    .content   { height: 100%; overflow-y: auto; padding: 6px 26px 26px; }
    .page.hidden { display: none; }
    .page-head { margin-bottom: 18px; }
    .page-title{ font-size: 20px; font-weight: 600; letter-spacing: .3px; }
    .page-desc { margin-top: 5px; font-size: 12px; color: var(--muted); line-height: 1.7; }

    .section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
    }
    /* 字段直接叠在卡片里时自己撑开间距，不像 .row/.grid 那样有栅格的 gap */
    .section.stack { display: flex; flex-direction: column; gap: 18px; }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 600;
    }
    /* 卡片底部的操作条：按钮紧贴自己用到的那组字段，不再单独成块 */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px -20px -20px;
      padding: 14px 20px;
      background: #fafbfd;
      border-top: 1px solid var(--line-soft);
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .card-actions .spacer { flex: 1; }
    .section-title .tag {
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      background: #f2f5f9;
      border-radius: 999px;
    }
    .section-title .tag.tag-required {
      color: var(--accent);
      background: var(--glow);
    }
    .pill.instance-pill-badge {
      cursor: pointer;
      user-select: none;
      transition: all .15s ease;
      gap: 5px;
    }
    .pill.instance-pill-badge:hover {
      background: #ffffff;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 2px 6px rgba(16, 24, 40, 0.08);
    }
    .instance-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
      flex: none;
    }
    .instance-pill-text {
      font-family: Menlo, "SF Mono", "Cascadia Code", Consolas, monospace;
      font-size: 11px;
    }
    .instance-pill-refresh {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      background: transparent;
      padding: 0;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s ease;
    }
    .instance-pill-refresh:hover {
      background: var(--line);
      color: var(--accent);
      transform: rotate(180deg);
    }
    .pill.instance-inline-editor {
      position: relative;
      z-index: 30;
      gap: 4px;
      padding: 0 5px 0 8px;
      animation: fadeIn .12s ease-out;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(16, 24, 40, 0.12);
    }
    .pill.instance-inline-editor .editor-label {
      color: var(--muted);
      font-size: 11px;
    }
    .pill .instance-mini-input {
      width: 36px !important;
      height: 18px !important;
      padding: 0 4px !important;
      font-size: 11px !important;
      font-family: Menlo, "SF Mono", "Cascadia Code", Consolas, monospace !important;
      text-align: center;
      border-radius: 4px !important;
      border: 1px solid var(--line) !important;
    }
    .pill .instance-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: #ffffff;
      padding: 0;
      color: var(--text-2);
      cursor: pointer;
      transition: all .12s ease;
    }
    .pill .instance-action-btn:hover {
      background: var(--line-soft);
      color: var(--accent);
      border-color: var(--accent);
    }
    .pill .instance-action-btn.ok {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .pill .instance-action-btn.ok:hover {
      background: var(--accent-2);
    }
    .device-bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .device-no-field {
      width: 320px;
      max-width: 100%;
    }
    .device-no-field input {
      width: 100%;
    }
    .device-select-wrapper {
      position: relative;
      display: inline-flex;
    }
    .device-select-trigger-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #ffffff;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: all .15s ease;
    }
    .device-select-trigger-btn:hover {
      background: #f8faff;
      border-color: var(--accent);
      color: var(--accent);
    }
    .device-select-trigger-btn.active {
      background: #f0f5ff;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 2px rgba(45, 91, 255, 0.12);
    }
    .device-select-trigger-btn svg.caret {
      color: var(--muted);
      transition: transform .15s ease;
    }
    .device-select-trigger-btn svg.caret.open {
      transform: rotate(180deg);
    }
    .device-dropdown-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 175px;
      max-height: 280px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(22, 32, 56, 0.15);
      z-index: 100;
      animation: fadeIn .12s ease-out;
    }
    .device-dropdown-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px 7px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--line-soft);
      background: #fafbfd;
      border-radius: 10px 10px 0 0;
    }
    .device-dropdown-count {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--line-soft);
      color: var(--muted);
      font-weight: normal;
    }
    .device-dropdown-items {
      padding: 4px 0;
    }
    .device-dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      transition: background .12s ease;
    }
    .device-dropdown-item:hover {
      background: #f2f6ff;
    }
    .device-dropdown-item.active {
      background: #eef4ff;
      font-weight: 600;
    }
    .device-dropdown-item .dev-no {
      font-family: Menlo, "SF Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
    }
    .device-dropdown-item.active .dev-no {
      color: var(--accent);
    }
    .device-dropdown-empty {
      padding: 20px 14px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    .battery-combo-wrapper {
      position: relative;
      width: 100%;
    }
    .battery-dropdown-popover {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 100%;
      width: max-content;
      max-width: 420px;
      max-height: 260px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(22, 32, 56, 0.18);
      z-index: 100;
      animation: fadeIn .12s ease-out;
    }
    .battery-dropdown-items {
      padding: 2px 0;
    }
    .battery-dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      transition: background .12s ease;
      font-size: 12px;
      border-bottom: 1px solid var(--line-soft);
    }
    .battery-dropdown-item:last-child {
      border-bottom: none;
    }
    .battery-dropdown-item:hover {
      background: var(--bg-top);
    }
    .battery-dropdown-item.active {
      background: var(--bg-top);
      font-weight: 600;
    }
    .battery-dropdown-item .bat-no {
      font-family: Menlo, "SF Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
    }
    .battery-dropdown-item.active .bat-no {
      color: var(--accent);
    }
    .battery-dropdown-item .bat-binding {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .battery-dropdown-item .bat-binding.bound-cur {
      color: var(--accent);
      background: var(--bg-top);
      padding: 1px 6px;
      border-radius: 4px;

    /* 中控客户端响应式分屏 (4:6 比例，带平滑抽屉式位移动画) */

    .device-layout {
      display: grid;
      grid-template-columns: 216px minmax(0, 1fr);

    }
    .device-list { position: sticky; top: 6px; display: flex; flex-direction: column; gap: 10px;
                   background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    .device-list:focus { outline: none; }
    .device-list-head { display: flex; align-items: center; justify-content: space-between;
                        font-size: 13px; font-weight: 600; color: var(--text-2); }
    .device-list-head .icon-btn { width: 26px; height: 26px; border-radius: 7px; }
    @keyframes copyPulse {

      40% { box-shadow: 0 0 0 4px rgba(15, 157, 118, 0.25); transform: scale(1.02); }

    .device-add > input { width: 100%; }

    }
    .device-item { position: relative; padding: 8px 12px; border-radius: 10px; border: 1.5px solid transparent; cursor: pointer; transition: all .15s ease; }
    /* 左侧色条标环境，与环境标签同一套配色，不额外占用编号的宽度 */
    .device-item::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px;
                           border-radius: 0 3px 3px 0; background: var(--env-color, transparent); }

    .device-item:hover { background: var(--bg-top); }
    .device-item:active { transform: scale(0.97); }

    .device-item.active .device-no { color: var(--accent); }

    .device-no { font-size: 13px; font-weight: 600; flex: 1; min-width: 0;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 悬停才出现，且不占位：编号要把这一行的宽度全部用满 */
    .device-del { position: absolute; top: 7px; right: 7px; opacity: 0; border: none; color: var(--muted);
                  background: var(--bg-top); border-radius: 6px; transition: opacity .12s ease;
                  display: inline-flex; align-items: center; justify-content: center; padding: 2px; cursor: pointer; line-height: 1; }

      .device-item { flex: none; padding-right: 26px; }

    /* 百宝箱三击敲鸡蛋 */
    .egg-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(12, 18, 32, 0.68);
      backdrop-filter: blur(3px);
      cursor: zoom-out;
      animation: eggFade .18s ease-out;
    }
    @keyframes eggFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .egg-img {
      max-width: 76vw;
      max-height: 76vh;
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      animation: eggPop .28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* 藏起来但仍然会下载，加载完成才换成展示态 */
    .egg-img.waiting { display: none; }
    .egg-knock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      max-width: 82vw;
      text-align: center;
      font-size: clamp(26px, 5vw, 54px);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 28px rgba(120, 170, 255, .55), 0 10px 30px rgba(0, 0, 0, .45);
      animation: eggShout .5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* 文字先冲出来再轻轻呼吸，等的这几秒才像在酝酿 */
    @keyframes eggShout {
      0% { opacity: 0; transform: scale(0.6); filter: blur(6px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    .egg-knock span { animation: eggBreathe 2.2s ease-in-out infinite; }
    @keyframes eggBreathe {
      0%, 100% { transform: scale(1); text-shadow: 0 0 28px rgba(120, 170, 255, .55), 0 10px 30px rgba(0, 0, 0, .45); }
      50% { transform: scale(1.04); text-shadow: 0 0 46px rgba(150, 200, 255, .85), 0 10px 30px rgba(0, 0, 0, .45); }
    }
    /* 小锤以柄尾为支点抡下来，落点是蛋的右肩 */
    .egg-hammer {
      transform-box: view-box;
      transform-origin: 34px 27px;
      animation: eggHammer .7s ease-in-out infinite;
    }
    @keyframes eggHammer {
      0%, 100% { transform: rotate(40deg); }
      18% { transform: rotate(0deg); }
      34% { transform: rotate(16deg); }
    }
    /* 裂纹按 steps 一段段长，和每次敲击对上 */
    .egg-crack {
      fill: none;
      stroke: rgba(15, 23, 42, .35);
      stroke-width: 1;
      stroke-linecap: round;
      stroke-dasharray: 7;
      stroke-dashoffset: 7;
      animation: eggCrack 2.8s steps(4) .15s infinite;
    }
    @keyframes eggCrack {
      to { stroke-dashoffset: 0; }
    }
    /* 蛋以底部为轴，被敲到的那一下往左偏一点再晃回来 */
    .egg-shell.knocking {
      transform-box: view-box;
      transform-origin: 12px 28px;
      animation: eggKnock .7s ease-in-out infinite;
    }
    @keyframes eggKnock {
      0%, 100% { transform: rotate(0); }
      20% { transform: rotate(-5deg); }
      50% { transform: rotate(3deg); }
      75% { transform: rotate(-1.5deg); }
    }
    @keyframes eggPop {
      0% { opacity: 0; transform: scale(0.88) rotate(-2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    .field-inline { display: flex; align-items: center; gap: 8px; }
    .field-inline > input, .field-inline > select { flex: 1; min-width: 0; }
    .field-inline > button { flex: none; }

    input[type="text"], input[type="number"], input[type="password"], select, textarea {

    /* 与输入框同高，放在一行时不会一高一矮 */

      color: var(--text);

      border: 1px solid #dde3ec;

    button.ok:active:not(:disabled) {
      transform: scale(0.96) translateY(1px);

    button.link {

    button.icon-btn:active:not(:disabled) {

  <script>
    // WGS-84 to GCJ-02 (高德火星坐标系) 转换算法
    function wgs84ToGcj02(lng, lat) {
      const a = 6378245.0;
      const ee = 0.00669342162296594323;
      if (lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271) {
        return [lng, lat];
      }
      let dLat = transformLat(lng - 105.0, lat - 35.0);
      let dLng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = (lat / 180.0) * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / (((a * (1 - ee)) / (magic * sqrtMagic)) * Math.PI);
      dLng = (dLng * 180.0) / ((a / sqrtMagic) * Math.cos(radLat) * Math.PI);
      return [lng + dLng, lat + dLat];
    }

    function transformLat(x, y) {
      let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * (2.0 / 3.0);
      ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * (2.0 / 3.0);
      ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * (2.0 / 3.0);
      return ret;
    }

    function transformLng(x, y) {
      let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * (2.0 / 3.0);
      ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * (2.0 / 3.0);
      ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 3.0 * Math.PI)) * (2.0 / 3.0);
      return ret;
    }

    // IP 定位降级方案
    async function fallbackIpLocation() {
      try {
        const res = await fetch('https://ipwho.is/');
        if (res.ok) {
          const data = await res.json();
          if (data && data.success && data.latitude && data.longitude) {
            return [data.longitude, data.latitude];
          }
        }
      } catch (e) {}

      try {
        const res2 = await fetch('https://ipinfo.io/json');
        if (res2.ok) {
          const data2 = await res2.json();
          if (data2 && data2.loc) {
            const parts = data2.loc.split(',');
            if (parts.length === 2) {
              const lat = parseFloat(parts[0]);
              const lng = parseFloat(parts[1]);
              if (!isNaN(lat) && !isNaN(lng)) {
                return [lng, lat];
              }
            }
          }
        }
      } catch (e) {}

      return null;

    window.locateCurrentPosition = function(onSuccess, onError) {
      let resolved = false;

      function applyCoord(rawLng, rawLat, isWgs84) {
        if (resolved) return;
        resolved = true;
        const [gcjLng, gcjLat] = isWgs84 ? wgs84ToGcj02(rawLng, rawLat) : [rawLng, rawLat];
        window.jumpMapCoord(gcjLng, gcjLat);
        const coordStr = gcjLng.toFixed(6) + ',' + gcjLat.toFixed(6);
        if (typeof onSuccess === 'function') {
          onSuccess(coordStr);
        }
      }

      function doIpFallback() {
        fallbackIpLocation().then(function(coords) {
          if (coords) {
            applyCoord(coords[0], coords[1], true);
          } else {
            if (typeof onError === 'function') onError('获取物理定位及 IP 定位失败');

          if (!resolved) {
            doIpFallback();

            clearTimeout(timer);
            const wgsLat = position.coords.latitude;

      let lng = 108.38;
      let lat = 22.77;
      let zoom = 14;
      let hasCustomCoord = false;

      if (initialCoordStr && initialCoordStr.indexOf(',') !== -1) {
        const parts = initialCoordStr.split(',');
        const pLng = parseFloat(parts[0]);
        const pLat = parseFloat(parts[1]);
        if (!isNaN(pLng) && !isNaN(pLat) && pLng > 0 && pLat > 0) {

          if (initialCoordStr.trim() !== "116.29721053978871,40.05213174125153" && initialCoordStr.trim() !== "113.324520,23.109980" && initialCoordStr.trim() !== "108.38,22.77") {

            layer.bindPopup(`<div style="font-size:12px;line-height:1.5;font-weight:500;"><b>已选坐标 (GCJ-02)</b><br><span style="color:#0f9d76;font-family:monospace;">${coordStr}</span></div>`).openPopup();
            if (typeof window._activeMapOnPick === 'function') {
              window._activeMapOnPick(coordStr);
            }
          }
        });
      }
    };

    window.startLogResize = function(onResize, onEnd) {
      document.body.style.cursor = 'row-resize';
      document.body.style.userSelect = 'none';
      const pane = document.querySelector('.log-pane');
      if (pane) pane.classList.add('is-resizing');

      function onMouseMove(e) {
        const h = window.innerHeight - e.clientY - 20;
        const clampedH = Math.max(90, Math.min(window.innerHeight - 130, h));
        if (typeof onResize === 'function') onResize(clampedH);
      }

      function onMouseUp() {
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        if (pane) pane.classList.remove('is-resizing');
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        if (typeof onEnd === 'function') onEnd();
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    };
  </script>
