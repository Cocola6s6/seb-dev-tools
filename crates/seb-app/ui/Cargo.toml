[package]
name = "seb-ui"
version = "0.2.2"
edition = "2021"

[[bin]]
name = "seb-ui"
path = "src/main.rs"

[dependencies]
sycamore             = { version = "0.9", features = ["web"] }
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
web-sys              = { version = "0.3", features = ["Window", "Document", "Element", "Event", "EventTarget", "HtmlInputElement", "HtmlSelectElement", "Navigator", "Clipboard", "KeyboardEvent"] }
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
serde-wasm-bindgen   = "0.6"
gloo-timers          = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

# 与上级 workspace 隔离（目标平台是 wasm32，不是原生）
[workspace]
