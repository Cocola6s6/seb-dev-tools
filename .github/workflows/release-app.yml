name: Release App
permissions:
  contents: write

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    name: build-tauri (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauri-args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            tauri-args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            wasm32-unknown-unknown${{ matrix.rust-targets != '' && format(',{0}', matrix.rust-targets) || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/seb-app/ui -> target

      - name: Install Trunk
        shell: bash
        run: |
          TRUNK_VERSION="0.21.7"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            curl -LsSf "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
              | tar xzf - -C ~/.cargo/bin/
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ARCH=$(uname -m)
            if [[ "$ARCH" == "arm64" ]]; then
              curl -LsSf "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-aarch64-apple-darwin.tar.gz" \
                | tar xzf - -C ~/.cargo/bin/
            else
              curl -LsSf "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-apple-darwin.tar.gz" \
                | tar xzf - -C ~/.cargo/bin/
            fi
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            curl -LsSf -o trunk.zip "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-pc-windows-msvc.zip"
            unzip -o trunk.zip -d "$HOME/.cargo/bin/"
            rm trunk.zip
          fi
          trunk --version

      - name: Build frontend (WASM)
        working-directory: crates/seb-app/ui
        run: trunk build --release

      - name: Build Tauri app & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: crates/seb-app
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri-args }}

  publish-to-cos:
    name: Sync Release to Tencent COS
    needs: build-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET: ${{ secrets.COS_BUCKET }}
      COS_REGION: ${{ secrets.COS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install coscli (Tencent Official Go CLI)
        run: |
          COSCLI_VERSION="v1.0.9"
          curl -LsSf -o /usr/local/bin/coscli "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-${COSCLI_VERSION}-linux-amd64"
          chmod +x /usr/local/bin/coscli
          coscli --version

      - name: Configure coscli
        run: |
          coscli config set --init-skip --secret_id "${COS_SECRET_ID}" --secret_key "${COS_SECRET_KEY}"
          coscli config add --init-skip -b "${COS_BUCKET}" -r "${COS_REGION}" -a "default"

      - name: Download all release assets
        run: |
          mkdir -p release-assets
          gh release download ${{ github.ref_name }} --dir release-assets

      - name: Generate latest.json
        run: |
          python scripts/sync_release_to_cos.py --dir release-assets --version ${{ github.ref_name }} --generate-only

      - name: Sync to Tencent COS via coscli
        run: |
          coscli sync release-assets/ cos://default/seb-dev-tools/releases/ -r --acl public-read


